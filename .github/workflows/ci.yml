name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.2
      - run: ruff check .
      - run: ruff format --check .

  imports:
    name: import smoke (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # Only lxml: the heavy stack (torch, bert-score, sacrebleu, nltk,
      # google-genai) is confined to validate.py and gemini.py, which are not
      # imported here. Keeping them out keeps CI at seconds, not minutes.
      - run: pip install "lxml>=5.0.0"
      - name: Import every pipeline module
        run: |
          cd src
          for m in align build classify extract filter make_sample scout_tags stats; do
            echo "importing $m"
            python -c "import $m"
          done

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # gemini.py needs tenacity and python-dotenv; the google-genai SDK itself
      # is stubbed in tests/conftest.py. The heavy MT-metrics stack stays out.
      - run: pip install "lxml>=5.0.0" "tenacity>=8.2.0" "python-dotenv>=1.0.0" pytest
      - run: pytest -q
